[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faultwarden"
version = "0.1.0"
description = "Autonomous AI SRE / Incident Response Engineer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "langchain>=0.2.14",
    "langgraph>=0.2.14",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "structlog>=24.4.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faultwarden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "demo_service"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "TC001", "TC002", "TC003"]
"migrations/*" = ["ARG", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["faultwarden"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "prometheus_client.*",
    "opentelemetry.*",
    "asyncpg.*",
    "structlog.*",
    "langchain.*",
    "langchain_core.*",
    "langgraph.*",
    "langgraph_checkpoint_postgres.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
