name: Docker Build & Validation

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "demo_service/**"
      - "docker-compose.yml"
      - "src/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "demo_service/**"
      - "docker-compose.yml"
      - "src/**"
      - "migrations/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify docker-compose configuration
        run: docker compose config --quiet

  build-faultwarden:
    name: Build FaultWarden Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build FaultWarden container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: faultwarden:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image smoke test
        run: |
          docker run --rm faultwarden:test python -c "import faultwarden; print('FaultWarden image OK')"

  build-demo-service:
    name: Build Demo Service Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Demo Service container
        uses: docker/build-push-action@v7
        with:
          context: ./demo_service
          file: ./demo_service/Dockerfile
          push: false
          load: true
          tags: demo-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify demo service smoke test
        run: |
          docker run --rm demo-service:test python -c "import fastapi, prometheus_client; print('Demo service image OK')"
