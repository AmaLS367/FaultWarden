name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: "0"
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache Ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('uv.lock', '**/*.py') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Ruff Formatting Check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache Mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'src/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Mypy Type Checking
        run: uv run mypy src

  test:
    name: Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Cache Pytest
        uses: actions/cache@v6
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-3.12-${{ hashFiles('uv.lock', 'tests/**/*.py', 'src/**/*.py') }}
          restore-keys: |
            pytest-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest Test Suite
        run: uv run pytest --cov=src --cov-report=term-missing
